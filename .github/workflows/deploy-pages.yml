name: Deploy SEO Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/korea-performance-marketing-agent-f28c1f
  schedule:
    # Refresh data every day at 09:00 KST (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SEO parallel pipeline (rule-based, no LLM)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -c "
          from workflows.seo_parallel_runner import SEOParallelRunner
          runner = SEOParallelRunner(max_workers=4, llm_augment=False, verbose=True)
          result = runner.run_full_seo_pipeline(skip_llm_in_parallel=True)
          print('Pipeline complete. Issues:', result.get('summary', {}).get('total_seo_issues', 0))
          "

      - name: Export dashboard data to docs/data/
        run: python scripts/export_dashboard_data.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
